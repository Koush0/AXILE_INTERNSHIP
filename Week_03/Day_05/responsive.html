<!DOCTYPE html>
<html>
<head>
    <title>Responsive Design</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f0f0;
        }

        /* Header */
        .header {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Container */
        .container {
            width: 90%;
            margin: 20px auto;
        }

        /* Sidebar and Content */
        .sidebar {
            width: 30%;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            float: left;
        }

        .content {
            width: 70%;
            background-color: white;
            padding: 20px;
            float: left;
        }

        /* Clear float */
        .clear {
            clear: both;
        }

        /* Footer */
        .footer {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        /* 🔥 Basic Media Query */
        @media (max-width: 768px) {

            .sidebar,
            .content {
                width: 100%;
                float: none;
                margin-bottom: 15px;
            }

        }

    </style>
</head>

<body>

    <div class="header">
        <h1>Responsive Web Design</h1>
    </div>

    <div class="container">

        <div class="sidebar">
            <h3>Menu</h3>
            <p>Home</p>
            <p>About</p>
            <p>Services</p>
            <p>Contact</p>
        </div>

        <div class="content">
            <h2>Main Content</h2>
            <p>
                This layout uses percentage width for responsiveness.
                Resize the browser window or check mobile view to see changes.
            </p>
        </div>

        <div class="clear"></div>

    </div>

    <div class="footer">
        © 2026 Internship Assignment
    </div>

</body>
</html>
