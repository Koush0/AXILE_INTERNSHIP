<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 250px 1fr;
            grid-template-rows: 70px 1fr 60px;
            height: 100vh;
        }

        header {
            grid-area: header;
            background: #1e1e2f;
            color: white;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 22px;
        }

        aside {
            grid-area: sidebar;
            background: #2c2c3e;
            color: white;
            padding: 20px;
        }

        aside ul {
            list-style: none;
            margin-top: 20px;
        }

        aside ul li {
            margin: 15px 0;
            cursor: pointer;
        }

        aside ul li:hover {
            color: #00c6ff;
        }

        main {
            grid-area: main;
            background: #f4f6fa;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        footer {
            grid-area: footer;
            background: #1e1e2f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>

<body>

    <header>
        My Dashboard Layout
    </header>

    <aside>
        <h3>Navigation</h3>
        <ul>
            <li>Home</li>
            <li>Profile</li>
            <li>Settings</li>
            <li>Reports</li>
        </ul>
    </aside>

    <main>

        <div class="card">
            <h2>Welcome</h2>
            <p>This is a structured layout using CSS Grid.</p>
        </div>

        <div class="card">
            <h2>Statistics</h2>
            <p>Users: 1200</p>
            <p>Projects: 85</p>
        </div>

        <div class="card">
            <h2>Updates</h2>
            <p>New dashboard design implemented successfully.</p>
        </div>

    </main>

    <footer>
        © 2026 Internship Project
    </footer>

</body>
</html>
