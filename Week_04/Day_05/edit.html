<!DOCTYPE html>
<html>
<head>
    <title>Edit Contact</title>
</head>
<body>

<h2>Edit Contact</h2>

<form action="/update/{{ record[0] }}" method="POST">
    Name:
    <input type="text" name="name" value="{{ record[1] }}" required><br><br>

    Email:
    <input type="email" name="email" value="{{ record[2] }}" required><br><br>

    <button type="submit">Update</button>
</form>

</body>
</html>
