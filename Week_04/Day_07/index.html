<!DOCTYPE html>
<html>
<head>
    <title>StudentVault - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-bg">

<div class="auth-box">
    <h1 class="logo">StudentVault</h1>

</div>

<script src="script.js"></script>
</body>
</html>
