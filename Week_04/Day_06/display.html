<!DOCTYPE html>
<html>
<head>
    <title>Stored Contacts</title>
</head>
<body>

<h2>Stored Contacts</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Action</th>
    </tr>

    {% for row in records %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>
            <a href="/edit/{{ row[0] }}">Edit</a> |
            <a href="/delete/{{ row[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="/">Go Back</a>

</body>
</html>
