<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h2>Edit Student</h2>

<form action="/update/{{ record[0] }}" method="POST">
    Name:
    <input type="text" name="name" value="{{ record[1] }}" required><br><br>

    Age:
    <input type="number" name="age" value="{{ record[2] }}" required><br><br>

    Course:
    <input type="text" name="course" value="{{ record[3] }}" required><br><br>

    <button type="submit">Update</button>
</form>

<br>
<a href="/view">Back</a>

</body>
</html>
