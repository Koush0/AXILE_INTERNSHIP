<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
</head>
<body>

<h2>Student Records</h2>

<table border="1">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Course</th>
    <th>Action</th>
</tr>

{% for row in records %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>
        <a href="/edit/{{ row[0] }}">Edit</a> |
        <a href="/delete/{{ row[0] }}">Delete</a>
    </td>
</tr>
{% endfor %}

</table>

<br>
<a href="/">Add New Student</a>

</body>
</html>
